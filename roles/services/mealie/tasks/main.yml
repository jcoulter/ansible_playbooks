---
- name: Ensure mealie data directory exists with correct permissions
  become: yes
  ansible.builtin.file:
    path: "{{ data_root }}/mealie_data"
    state: directory
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0755"

- name: Backup mealie database before any container changes
  become: yes
  ansible.builtin.copy:
    src: "{{ data_root }}/mealie_data/mealie.db"
    dest: "{{ data_root }}/mealie_data/backups/mealie_pre_deploy_{{ ansible_date_time.iso8601_basic_short }}.db"
    remote_src: yes
  ignore_errors: yes

- name: Make sure the mealie container is created and running
  docker_container:
    image: "ghcr.io/mealie-recipes/mealie:{{ mealie_version }}"
    name: mealie
    networks:
      - name: proxy
    dns_servers:
      - "{{ server_ip }}"
    labels:
      traefik.enable: "true"
      traefik.http.routers.mealie.entrypoints: "http"
      traefik.http.routers.mealie.rule: "Host(`mealie.{{ domain }}`)||Host(`mealie-in.{{ domain }}`)"
      traefik.http.middlewares.mealie-https-redirect.redirectscheme.scheme: "https"
      traefik.http.routers.mealie.middlewares: "mealie-https-redirect"
      traefik.http.routers.mealie-secure.entrypoints: "https"
      traefik.http.routers.mealie-secure.rule: "Host(`mealie.{{ domain }}`)||Host(`mealie-in.{{ domain }}`)"
      traefik.http.routers.mealie-secure.tls: "true"
      traefik.http.routers.mealie-secure.service: "mealie"
    pull: yes
    state: 'started'
    env:
      ALLOW_SIGNUP: "false"
      PUID: "{{ puid }}"
      PGID: "{{ pgid }}"
      TZ: "{{ timezone }}"
      BASE_URL: "https://mealie.{{ domain }}"
    volumes:
      - "{{ data_root }}/mealie_data:/app/data/"
    restart_policy: unless-stopped
