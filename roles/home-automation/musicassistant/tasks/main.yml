---
# https://music-assistant.io/installation/
# SETUP: Create a long-lived access token in Home Assistant (Profile -> Security -> Long-Lived Access Tokens)
# In Music Assistant, add Home Assistant provider with URL: http://localhost:8123 and paste the token

- name: Make sure the {{ container_name }} container is created and running
  become: yes
  docker_container:
    name: "{{ container_name }}"
    image: "ghcr.io/music-assistant/server:{{ musicassistant_version }}"
    # SYS_ADMIN + DAC_READ_SEARCH + apparmor:unconfined are required by Music Assistant
    # to mount SMB/NFS shares from within the container for local media access.
    # See: https://music-assistant.io/installation/
    capabilities:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    security_opts:
      - apparmor:unconfined
    network_mode: host
    pull: yes
    state: 'started'
    env:
      PUID: "{{ puid }}"
      PGID: "{{ pgid }}"
      TZ: "{{ timezone }}"
      LOG_LEVEL: 'info'
    volumes:
      - "{{ config_root }}/music_assistant_config:/data"
      - "{{ data_root }}/media:/media"
    restart_policy: unless-stopped
